title: Mo Chreach! Music Technology
description: Tutorials, live jams and free, open-source music software from Scotland. In-depth guides to the OP-XY, EP-133 and OP-Z, and tools like MIDI Surf.
url: https://mochreach.dev
lang: en-GB
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - README.md
  - scripts
permalink: /blog/:year/:title/
defaults:
  - scope: { path: "" }
    values: { layout: default, image: /assets/img/og.png }
  - scope: { path: "", type: posts }
    values: { layout: post, body_class: "page post" }
